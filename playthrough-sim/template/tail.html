</script>
<script>
const ALL=JSON.parse(document.getElementById('data').textContent);
let D,E,RS,SH,RO,NM,ACT, cur=0, curRound=0, curGame=0;

/* ---------- game selector ---------- */
const gamesEl=document.getElementById('games');
ALL.games.forEach((g,i)=>{
  const b=document.createElement('button'); b.className='game';
  b.innerHTML='<b>'+esc(g.meta.title)+'</b><span class="long">'+esc(g.meta.subtitle)+'</span><span class="brief">'+esc(g.meta.short)+'</span>';
  b.onclick=()=>loadGame(i,true);
  gamesEl.appendChild(b);
});
function loadGame(i,push){
  curGame=i; D=ALL.games[i]; E=D.entries; RS=D.rounds; SH=D.short; RO=D.role; NM=D.names;
  ACT=new Set(D.active.map(String));
  [...gamesEl.children].forEach((b,j)=>{b.classList.toggle('on',j===i);b.setAttribute('aria-pressed',j===i);});
  document.getElementById('blurb').textContent=D.meta.blurb;
  const n=(D.need[Object.keys(D.need)[0]]||[]).length;
  document.getElementById('objtitle').textContent='Objectives — '+(n?WORDS[n]+' pieces and 20 million':'');
  tabs.innerHTML='';
  RS.forEach((r,k)=>{const b=document.createElement('button');
    b.textContent=r.n?'Year '+r.n:'Setup'; b.onclick=()=>{showRound(k);select(r.start);};
    tabs.appendChild(b);});
  const fb=document.createElement('button'); fb.textContent='Result';
  fb.onclick=()=>{showRound(RS.length);select(E.length-1);}; tabs.appendChild(fb);
  document.getElementById('legend').innerHTML='';
  cur=0; showRound(0);
  if(push){try{history.replaceState(null,'','#'+D.meta.key);}catch(e){}}
}
const WORDS={4:'four',5:'five',3:'three'};

/* ---------- transcript ---------- */
const tabs=document.getElementById('tabs');
const script=document.getElementById('script');
function showRound(i){
  curRound=i;
  [...tabs.children].forEach((b,j)=>b.classList.toggle('on',j===i));
  script.innerHTML='';
  if(i===RS.length){renderFinal();return;}
  const r=RS[i], end=(i+1<RS.length)?RS[i+1].start:E.length;
  const h=document.createElement('div'); h.className='yr-head';
  h.innerHTML='<h2>'+(r.n?'Year '+r.n:'Setup')+' — '+esc(r.title)+'</h2>'+
    '<div class="card-txt"><b>'+(r.n?'I Ching':'The table')+'</b>'+esc(r.card)+'</div>';
  script.appendChild(h);
  for(let k=r.start;k<end;k++) script.appendChild(node(k));
  select(cur>=r.start&&cur<end?cur:r.start);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function label(h,fallback){return h.length>1?'At the table':(h[0].w?h[0].w+' is thinking':fallback);}
function node(k){
  const e=E[k], wrap=document.createElement('div'); wrap.className='ent';
  if(e.k==='say'){
    const d=document.createElement('div');
    d.className='say'; d.dataset.i=k; if(e.h){d.tabIndex=0;d.setAttribute('role','button');}
    d.innerHTML='<span class="who">'+esc(e.who||'')+'</span><span class="'+(e.h?'hasnote':'')+'">“'+esc(e.t)+'”</span>';
    if(e.h) attach(d,e.h,label(e.h,(e.who||'')+' is thinking'));
    d.onclick=()=>select(k);
    wrap.appendChild(d);
  }else if(e.k==='lot'){
    const det=document.createElement('details'); det.className='lot';
    const sum=document.createElement('summary');
    sum.className='act lotsum'; sum.dataset.i=k;
    sum.innerHTML='<div class="lotrow"><span class="lotmark">LOT</span><span class="'+(e.h?'hasnote':'')+'">'+
      esc(e.t)+'</span><span class="bidcount">'+e.bids.length+(e.bids.length===1?' bid':' bids')+' <b>▾</b></span></div>';
    if(e.h) attach(sum,e.h,label(e.h,'Behind the move'));
    sum.addEventListener('click',()=>select(k));
    det.appendChild(sum);
    const bx=document.createElement('div'); bx.className='bids';
    e.bids.forEach(b=>{
      const r=document.createElement('div'); r.className='bid'+(b.amt===null?' pass':'');
      if(b.h){r.tabIndex=0;r.setAttribute('role','button');}
      r.innerHTML='<span class="who">'+esc(b.who)+'</span><span class="'+(b.h?'hasnote':'')+'">“'+esc(b.t)+'”</span>';
      if(b.h) attach(r,b.h,label(b.h,b.who+' is thinking'));
      bx.appendChild(r);
    });
    det.appendChild(bx); wrap.appendChild(det);
  }else{
    const b=document.createElement('button');
    b.className='act'+(e.big?' big':''); b.dataset.i=k;
    b.innerHTML='<span class="'+(e.h?'hasnote':'')+'">'+esc(e.t)+'</span><span class="arrow">▸</span>';
    if(e.h) attach(b,e.h,label(e.h,'Behind the move'));
    b.onclick=()=>select(k);
    wrap.appendChild(b);
  }
  const dl=deltas(k);
  if(dl.length){
    wrap.classList.add('hasd');
    const b=document.createElement('button'); b.type='button';
    b.className='dbtn d-'+(e.k==='say'||e.k==='lot'?e.k:'act');
    b.setAttribute('aria-label','What changed'); b.textContent='Δ';
    attach(b,()=>dhtml(dl),'What changed');
    b.addEventListener('click',ev=>{ev.stopPropagation(); select(k);});
    wrap.appendChild(b);
  }
  return wrap;
}
/* ---------- tooltip ---------- */
const tip=document.getElementById('tip');
const TOUCH=window.matchMedia('(hover: none)').matches||('ontouchstart' in window);
document.body.classList.toggle('touch',TOUCH);
let tipLock=false;
function hideTip(){tip.classList.remove('on','pinned');tipLock=false;}
function attach(el,text,lab){
  const body=()=>typeof text==='function' ? text() : Array.isArray(text)
    ? text.map(x=>'<p class="th">'+(x.w?'<b>'+esc(x.w)+'</b>':'')+esc(x.t)+'</p>').join('')
    : '<p class="th">'+esc(text)+'</p>';
  const paint=()=>{tip.innerHTML='<i>'+esc(lab)+'</i>'+body()+
    (TOUCH?'<button class="tipx" aria-label="Close">Close</button>':'');};
  if(TOUCH){
    el.addEventListener('click',()=>{
      paint(); tip.classList.add('on','pinned'); tipLock=true;
      setTimeout(()=>{tipLock=false;},0);
    });
    return;
  }
  const move=ev=>{const x=(ev.clientX||60),y=(ev.clientY||60);
    const w=tip.offsetWidth,h=tip.offsetHeight;
    tip.style.left=Math.min(x+16,innerWidth-w-10)+'px';
    tip.style.top=Math.min(Math.max(y-h/2,8),innerHeight-h-8)+'px';};
  const show=ev=>{paint();tip.classList.add('on');move(ev);};
  el.addEventListener('mouseenter',show); el.addEventListener('mousemove',move);
  el.addEventListener('mouseleave',()=>tip.classList.remove('on'));
  el.addEventListener('focus',()=>{const r=el.getBoundingClientRect();show({clientX:r.right,clientY:r.top+20});});
  el.addEventListener('blur',()=>tip.classList.remove('on'));
}
document.addEventListener('click',e=>{
  if(!TOUCH||tipLock)return;
  if(e.target.closest('.tip')&&!e.target.classList.contains('tipx'))return;
  if(e.target.closest('[data-i],.bid'))return;
  hideTip();
});
tip.addEventListener('click',e=>{if(e.target.classList.contains('tipx'))hideTip();});

/* ---------- selection & board ---------- */
function select(k){
  cur=k;
  document.querySelectorAll('.act,.say,.lotsum').forEach(n=>n.classList.toggle('on',+n.dataset.i===k));
  paint(E[k]);
}
function paint(e){
  const s=e.state, hl=new Set(e.hl||[]);
  drawMap(s,hl,e.mv); drawWorks(s); drawPlayers(s,hl); drawObjectives(s);
}
/* piece glyphs: one SVG per piece in images/, shared with the rulebook */
const IMG={CH:'customs-house',LD:'land-deed-scroll',BB:'bamboo-brush',DJ:'dragon-jar',WB:'wooden-bowl',VA:'vase'};
const WORKIMG={'Summer Palace':'summer-palace','Winter Palace':'winter-palace','Marble Pagoda':'marble-pagoda',
  irr2:'irrigation',res3:'reservoir',res7:'reservoir'};
function gsrc(n){return 'images/'+n+'.svg';}
function gimg(x,y,w,n,white){return '<image href="'+gsrc(n)+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+w+'"'+
  (white?' style="filter:brightness(0) invert(1)"':'')+'/>';}
function gpiece(n,text){return '<span class="piece"><img src="'+gsrc(n)+'" alt="">'+text+'</span>';}
/* the soldier glyph's outline (from tools/glyphs.py, filled in by build.py), so soldiers take each side's colour */
const SOLDIER=/*SOLDIER_PATH*/'';
function gsol(cls,title){return '<svg class="'+cls+'" viewBox="0 0 10 10" aria-hidden="true">'+(title?'<title>'+title+'</title>':'')+
  '<path d="'+SOLDIER+'" fill="currentColor"/></svg>';}
/* ---------- what changed, per step ---------- */
/* Each step's Δ compares its state with the step before: grain, realia (held and
   unsold), public works and new harvest squares (credited to the province's player),
   and soldiers, for every player and the Harvest Pile. */
const GRAIN_SVG='<svg class="dg" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 9.7V2.6" stroke="currentColor" stroke-width=".7" fill="none"/>'+
  '<g fill="currentColor"><ellipse cx="5" cy="1.5" rx=".85" ry="1.35"/>'+
  [[3.7,3.4,-35],[6.3,3.4,35],[3.7,5.5,-35],[6.3,5.5,35],[3.8,7.5,-35],[6.2,7.5,35]].map(([x,y,r])=>
    '<ellipse cx="'+x+'" cy="'+y+'" rx=".75" ry="1.25" transform="rotate('+r+' '+x+' '+y+')"/>').join('')+'</g></svg>';
const WORKGLYPH=Object.assign({wall:'great-wall',canal:'grand-canal'},WORKIMG);
const WORKNAME={wall:'Great Wall link',canal:'Grand Canal section',irr2:'Province 2 Irrigation System',
  res3:'Province 3 Reservoir',res7:'Province 7 Reservoir'};
function holdings(s){
  const H={}, add=(who,k,n)=>{if(!n)return; who=String(who); (H[who]=H[who]||{})[k]=(H[who][k]||0)+n;};
  const work=(seat,k,n)=>{const p=s.seat[seat]; if(p!=null) add(p,'w:'+k,n);};
  Object.entries(s.grain).forEach(([p,g])=>add(p,'g',g));
  add('pile','g',s.pile);
  Object.entries(s.held).forEach(([p,h])=>Object.entries(h).forEach(([t,n])=>add(p,'r:'+t,n)));
  Object.entries(s.stock||{}).forEach(([seat,h])=>Object.entries(h).forEach(([t,n])=>{if(s.seat[seat]!=null) add(s.seat[seat],'r:'+t,n);}));
  Object.entries(s.pile_stock||{}).forEach(([t,n])=>add('pile','r:'+t,n));
  const pw=s.pw||{};
  Object.entries(pw.wall||{}).forEach(([q,n])=>work(q,'wall',n));
  Object.entries(pw.canal||{}).forEach(([q,n])=>work(q,'canal',n));
  work(2,'irr2',pw.irr2); work(3,'res3',pw.res3); work(7,'res7',pw.res7);
  ['Summer Palace','Winter Palace','Marble Pagoda'].forEach(k=>work(1,k,pw[k]));
  Object.values(s.land||{}).forEach(seat=>work(seat,'land',1));
  (s.sol||[]).forEach(v=>add(v[3],'s:'+v[1],1));
  return H;
}
const DRANK={g:0,r:1,w:2,s:3};
function deltas(k){
  if(!k) return [];
  const A=holdings(E[k-1].state), B=holdings(E[k].state), s=E[k].state;
  const order=D.active.map(seat=>String(s.seat[seat])).concat(['pile']);
  Object.keys(A).concat(Object.keys(B)).forEach(x=>{if(!order.includes(x)) order.push(x);});
  const out=[];
  order.forEach(who=>{
    const a=A[who]||{}, b=B[who]||{};
    const keys=[...new Set(Object.keys(a).concat(Object.keys(b)))]
      .sort((x,y)=>(DRANK[x[0]]-DRANK[y[0]])||(x<y?-1:1));
    const parts=keys.map(key=>[key,Math.round(((b[key]||0)-(a[key]||0))*100)/100]).filter(p=>p[1]);
    if(parts.length) out.push([who,parts]);
  });
  return out;
}
function dsym(key){
  const [kind,v]=[key[0],key.slice(2)];
  if(kind==='g') return GRAIN_SVG;
  if(kind==='r') return '<img class="dg" src="'+gsrc(IMG[v])+'" alt="'+esc(D.rname[v])+'" title="'+esc(D.rname[v])+'">';
  if(kind==='s') return gsol('dg dsol'+(v==='W'?'':' b'),v==='W'?'Warlord soldier':'bought soldier');
  if(v==='land') return '<span class="dg dland" title="new harvest square"></span>';
  return '<img class="dg" src="'+gsrc(WORKGLYPH[v])+'" alt="'+esc(WORKNAME[v]||v)+'" title="'+esc(WORKNAME[v]||v)+'">';
}
function dhtml(dl){
  return dl.map(([who,parts])=>'<div class="drow"><b>'+esc(who==='pile'?'Harvest Pile':(SH[who]||NM[who]||who))+'</b><span>'+
    parts.map(([key,d])=>{const sg=d>0?'+':'−', n=Math.abs(d);
      return '<span class="dp '+(d>0?'up':'dn')+'">'+(key==='g'?sg+n+'&#8202;'+dsym(key):sg+dsym(key)+(n>1?'×'+n:''))+'</span>';
    }).join('')+'</span></div>').join('');
}
const CW=13;
/* squares are named like 'H12': row letter A-V, column 1-30 */
function sqrc(q){return [q.charCodeAt(0)-65, +q.slice(1)-1];}
function sqxy(q){const [r,c]=sqrc(q); return [(c+.5)*CW,(r+.5)*CW];}
function pathd(pts){return pts.map((p,i)=>(i?'L':'M')+(p[0]*CW).toFixed(1)+' '+(p[1]*CW).toFixed(1)).join('');}
/* province labels, in grid units: the spots map.svg uses for its own labels, clear of the rivers */
const LBL={'1':[18.4,6.9],'2':[13.2,8.3],'3':[11.4,11.6],'4':[19.8,11.7],'5':[19.5,15.7],'6':[19.9,17.9],'7':[14.8,17.2],'8':[3.9,11.9]};
function drawMap(s,hl,mv){
  const G=D.grid, R=G.length, C=G[0].length, M=D.map;
  const W=C*CW, H=R*CW;
  let svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="The board">'+
    '<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'+
    '<rect width="6" height="6" fill="#E6DFCB"/><line x1="0" y1="0" x2="0" y2="6" stroke="#D3CAB2" stroke-width="2.4"/></pattern>'+
    '<marker id="ahW" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L6 3L0 6z" fill="#16150F"/></marker>'+
    '<marker id="ahB" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L6 3L0 6z" fill="#175FB5"/></marker></defs>';
  /* the ground is ../map-board.svg, the printed map without frame, labels or works;
     this game's state is drawn on top of it */
  svg+='<image href="map-board.svg" x="0" y="0" width="'+W+'" height="'+H+'" preserveAspectRatio="none"/>';
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const g=G[r][c];
    if(/[1-7]/.test(g)&&!ACT.has(g)) svg+='<rect x="'+(c*CW)+'" y="'+(r*CW)+'" width="'+CW+'" height="'+CW+'" fill="url(#hatch)" opacity=".7"/>';
    else if(hl.has(+g)) svg+='<rect x="'+(c*CW)+'" y="'+(r*CW)+'" width="'+CW+'" height="'+CW+'" fill="#FFF6C8" opacity=".55"/>';
  }
  /* new harvest squares (Section 13): the rulebook's green squares */
  for(const q in (s.land||{})){
    const [r,c]=sqrc(q);
    svg+='<rect x="'+(c*CW+1)+'" y="'+(r*CW+1)+'" width="'+(CW-2)+'" height="'+(CW-2)+'" fill="#3E9A55" fill-opacity=".6" stroke="#1F6234" stroke-width=".9"><title>New harvest square, Province '+s.land[q]+'</title></rect>';
  }
  /* the Wall: four printed links above each of provinces 3, 2 and 1, drawn as on the map once built */
  for(const p in M.wall){
    const built=(s.pw.wall||{})[p]||0, owed=ACT.has(p);
    M.wall[p].forEach(([a,b],i)=>{
      const xy='x1="'+a[0]*CW+'" y1="'+a[1]*CW+'" x2="'+b[0]*CW+'" y2="'+b[1]*CW+'"';
      if(i<built) svg+='<line '+xy+' stroke="#6B4B2E" stroke-width="3.2" stroke-linecap="square"/>'+
        '<line '+xy+' stroke="#C9A877" stroke-width="1.6" stroke-linecap="square"/>';
      else svg+='<line '+xy+' stroke="#6B4B2E" stroke-width="1.3" stroke-dasharray="2 1.6" opacity="'+(owed?.75:.3)+'"/>';
    });
  }
  /* the Grand Canal: two printed sections in each of provinces 1, 4, 5 and 6 */
  for(const p in M.canal){
    const built=(s.pw.canal||{})[p]||0, owed=ACT.has(p);
    M.canal[p].forEach((pts,i)=>{
      const d='d="'+pathd(pts)+'" fill="none"';
      if(i<built) svg+='<path '+d+' stroke="#2E5E4E" stroke-width="2.6"/><path '+d+' stroke="#9CCFC0" stroke-width="1.1"/>';
      else svg+='<path '+d+' stroke="#2E5E4E" stroke-width="1.2" stroke-dasharray="2 1.5" opacity="'+(owed?.8:.3)+'"/>';
    });
  }
  /* palaces on their squares; cut-outs over the squares they cover */
  for(const k in (s.at||{})){
    const q=s.at[k], rcs=q.map(sqrc);
    const r0=Math.min(...rcs.map(v=>v[0])), r1=Math.max(...rcs.map(v=>v[0])), c0=Math.min(...rcs.map(v=>v[1])), c1=Math.max(...rcs.map(v=>v[1]));
    const x=c0*CW, y=r0*CW, w=(c1-c0+1)*CW, h=(r1-r0+1)*CW, pal=!/^(irr|res)/.test(k);
    svg+='<rect x="'+(x+1)+'" y="'+(y+1)+'" width="'+(w-2)+'" height="'+(h-2)+'" fill="'+(pal?'#C8291A':'#175FB5')+'"'+(pal?'':' opacity=".85" rx="2"')+'/>';
    const g=Math.min(w,h)-5;
    svg+=gimg(x+(w-g)/2,y+(h-g)/2,g,WORKIMG[k],true);
  }
  for(const k in s.board){
    const v=s.board[k], [r,c]=sqrc(k), x=c*CW, y=r*CW;
    if(v.raid) svg+='<rect x="'+(x+1)+'" y="'+(y+1)+'" width="'+(CW-2)+'" height="'+(CW-2)+
      '" fill="#F2416F" opacity=".75"/>';
    if(v.realia) svg+=gimg(x+1.5,y+1.5,CW-3,IMG[v.realia],v.raid);
  }
  /* this line's soldier moves, as arrows */
  (mv||[]).forEach(([a,b,side])=>{
    const [x1,y1]=sqxy(a),[x2,y2]=sqxy(b), dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy), k=(L-4.5)/L;
    svg+='<line x1="'+x1+'" y1="'+y1+'" x2="'+(x1+dx*k)+'" y2="'+(y1+dy*k)+'" stroke="'+(side==='W'?'#16150F':'#175FB5')+
      '" stroke-width="1.4" marker-end="url(#ah'+side+')"/>';
  });
  const at={}; (s.sol||[]).forEach(v=>{(at[v[2]]=at[v[2]]||[]).push(v);});
  for(const q in at){
    const [x,y]=sqxy(q), n=at[q].length;
    at[q].forEach((v,i)=>{
      const ox=n>1?(i-(n-1)/2)*5:0;
      svg+='<path d="'+SOLDIER+'" transform="translate('+(x+ox-4.5)+' '+(y-4.6)+') scale(.9)" fill="'+(v[1]==='W'?'#16150F':'#175FB5')+
        '" stroke="#fff" stroke-width="1.1" stroke-linejoin="round" paint-order="stroke"><title>'+esc(v[0])+'</title></path>';
    });
  }
  for(const p in LBL){
    const [x,y]=LBL[p], on=ACT.has(p), who=on?SH[s.seat[p]]:'empty';
    svg+='<text x="'+(x*CW)+'" y="'+(y*CW)+'" text-anchor="middle" font-family="Palatino Linotype,Palatino,Book Antiqua,Georgia,serif" '+
      'font-size="10" font-weight="'+(on?700:400)+'" font-style="'+(on?'normal':'italic')+'" fill="'+(on?'#3B2E1E':'#7D6E55')+'" stroke="#F6EEDC" stroke-width="2.6" paint-order="stroke">'+
      p+' '+esc(who)+'</text>';
  }
  svg+='</svg>';
  document.getElementById('map').innerHTML=svg;
  if(!document.getElementById('legend').innerHTML){
    const owe=n=>D.owed.some(o=>o[0]===n);
    const sys=owe('Province 2 Irrigation System')&&(owe('Province 3 Reservoir')||owe('Province 7 Reservoir'))?'Irrigation&nbsp;System&nbsp;or&nbsp;Reservoir':
      (owe('Province 2 Irrigation System')?'Irrigation&nbsp;System':'Reservoir');
    let L=gpiece('customs-house','Customs&nbsp;House')+gpiece('land-deed-scroll','Land&nbsp;Deed')+
      gpiece('bamboo-brush','Bamboo&nbsp;Brush')+gpiece('dragon-jar','Dragon&nbsp;Jar')+
      gpiece('wooden-bowl','Wooden&nbsp;Bowl')+gpiece('vase','Vase')+
      '<span><span class="sw raid"></span>raided&nbsp;square</span>'+
      (ACT.has('8')?'<span>'+gsol('sw sol')+'Warlord&nbsp;soldier</span><span>'+gsol('sw osol')+'bought&nbsp;soldier</span>':'')+
      '<span><span class="sw imp"><img src="'+gsrc('summer-palace')+'" alt=""></span>palace&nbsp;or&nbsp;pagoda</span>'+
      '<span><span class="sw wal"></span>Wall&nbsp;link</span>'+
      '<span><span class="sw can"></span>canal</span>'+
      '<span><span class="sw riv"></span>river</span>'+
      (ALL.games[curGame].entries.some(e=>Object.keys(e.state.land||{}).length)?'<span><span class="sw land"></span>new&nbsp;harvest&nbsp;square</span>':'')+
      '<span><span class="sw wat"><img src="'+gsrc(owe('Province 2 Irrigation System')&&!owe('Province 3 Reservoir')&&!owe('Province 7 Reservoir')?'irrigation':'reservoir')+'" alt=""></span>'+sys+'</span>'+
      (D.active.length<8?'<span><span class="sw empty"></span>province&nbsp;not&nbsp;in&nbsp;play</span>':'');
    document.getElementById('legend').innerHTML=L;
  }
}
function drawObjectives(s){
  let h='';
  D.active.forEach(p=>{
    const who=s.seat[p];
    if(p===1){
      h+='<div class="obj"><span class="on">'+esc(SH[who])+'</span><span class="objnote">no set — must build</span></div>'; return;
    }
    if(p===8){
      const others=D.active.filter(q=>q!==8&&q!==1).map(q=>s.seat[q]), rob=s.rob||{};
      /* at eight players one palace raid may stand in for one player's piece */
      const wild=D.active.length>=8, n=Math.min(others.length, others.filter(o=>rob[o]).length+(wild&&rob.palace?1:0));
      h+='<div class="obj"><span class="on">'+esc(SH[who])+'</span><span class="pips">'+
        others.map(o=>'<i class="'+(rob[o]?'f r':'')+'" title="'+esc(NM[o])+(rob[o]?' — raided: '+esc(D.rname[rob[o]]||rob[o]):'')+'">'+esc(SH[o].slice(0,3))+'</i>').join('')+
        (wild?'<i class="'+(rob.palace?'f r':'')+'" title="'+(rob.palace?'The '+esc(rob.palace)+', standing in for one player':'One palace raid may stand in for one player')+'">Pal</i>':'')+
        '</span><span class="objn'+(n===others.length?' done':'')+'">'+n+'/'+others.length+'</span></div>';
      return;
    }
    const need=D.need[p]||[], got=s.held[who]||{};
    const n=need.filter(t=>got[t]).length;
    h+='<div class="obj"><span class="on">'+esc(SH[who])+'</span><span class="pips">'+
      need.map(t=>'<i class="'+(got[t]?'f':'')+'" title="'+D.rname[t]+'"><img src="'+gsrc(IMG[t])+'" alt="'+D.rname[t]+'"></i>').join('')+
      '</span><span class="objn'+(n===need.length?' done':'')+'">'+n+'/'+need.length+'</span></div>';
  });
  document.getElementById('obj').innerHTML=h;
}
function builtCount(s,name){
  if(name==='Great Wall') return Object.values(s.pw.wall).reduce((a,b)=>a+b,0);
  if(name==='Grand Canal') return Object.values(s.pw.canal).reduce((a,b)=>a+b,0);
  return ({'Province 2 Irrigation System':s.pw.irr2,'Province 3 Reservoir':s.pw.res3,'Province 7 Reservoir':s.pw.res7})[name] ?? (s.pw[name]||0);
}
function drawWorks(s){
  let html='', paid=0, total=0;
  D.owed.forEach(([n,t,cost])=>{const d=Math.min(builtCount(s,n),t); paid+=d*cost; total+=t*cost;
    html+='<div>'+n+' <span style="float:right">'+d+'/'+t+'</span><div class="bar"><i style="width:'+(t?100*d/t:0)+'%"></i></div></div>';});
  html+='<div class="worktot">'+paid+' of '+total+' million built</div>';
  document.getElementById('works').innerHTML=html;
}
function drawPlayers(s,hl){
  let rows='<tr><th>#</th><th>Role</th><th>Player</th><th class="n">Grain</th></tr>';
  D.active.forEach(p=>{
    const who=s.seat[p]; const g=s.grain[who];
    rows+='<tr class="'+(hl.has(p)?'moved':'')+'"><td>'+p+'</td><td>'+RO[p]+'</td><td>'+esc(NM[who])+
      '</td><td class="n '+(g<0?'neg':'')+'">'+g+'</td></tr>';
  });
  const back=Object.entries(s.pile_stock||{}).map(([t,n])=>D.rname[t]+(n>1?' ×'+n:'')).join(', ');   /* realia sold back (Note 7) */
  rows+='<tr class="pile"><td></td><td colspan="2">Harvest Pile'+(back?' <small>· holds '+esc(back)+'</small>':'')+'</td><td class="n">'+s.pile+'</td></tr>';
  document.getElementById('res').innerHTML=rows;
}
function renderFinal(){
  let h='<div class="final"><h2>The result</h2><p>'+esc(D.results_note)+'</p>'+
    '<div class="tablewrap"><table><tr><th>Player</th><th>Started</th><th>Finished</th><th>Result</th><th>Grain</th></tr>';
  D.results.forEach(r=>{h+='<tr><td><b>'+esc(r.name)+'</b></td><td>'+r.start+' · '+r.startrole+'</td><td>'+
    r.fin+' · '+r.finrole+'</td><td class="v-'+r.verdict+'">'+r.verdict.toUpperCase()+'</td>'+
    '<td class="n" style="text-align:right;font-family:var(--mono)'+(r.grain<0?';color:#C8291A;font-weight:700':'')+'">'+r.grain+'</td></tr>';});
  h+='</table></div>'+D.epilogue.map(p=>'<p style="margin-top:1rem">'+esc(p)+'</p>').join('')+'</div>';
  script.innerHTML=h;
}
/* ---------- nav ---------- */
function step(d){
  let k=cur+d; if(k<0||k>=E.length)return;
  let ri=0; for(let i=0;i<RS.length;i++) if(k>=RS[i].start) ri=i;
  if(ri!==curRound) showRound(ri);
  select(k);
  const el=document.querySelector('[data-i="'+k+'"]');
  if(el) el.scrollIntoView({block:'center',behavior:'smooth'});
}
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.key==='ArrowRight'){step(1);e.preventDefault();}
  if(e.key==='ArrowLeft'){step(-1);e.preventDefault();}});
function fromHash(){return Math.max(0,ALL.games.findIndex(g=>'#'+g.meta.key===location.hash));}
addEventListener('hashchange',()=>{const i=fromHash(); if(i!==curGame) loadGame(i,false);});
/* ---------- piece glyphs in running text ---------- */
/* Every piece name the page writes gets its glyph in front (the board legend
   is keyed to the board's own marks, so it is left alone). The names come from
   tools/add_glyphs.py (build.py fills them in), so the page and the rulebook agree. */
const TERMS=/*PIECE_TERMS*/[];
const TERM_RE=new RegExp('\\b(?:'+TERMS.map(t=>'('+t[0]+')').join('|')+')\\b','g');
function glyphText(node){
  const t=node.nodeValue; TERM_RE.lastIndex=0;
  if(!TERM_RE.test(t))return;
  TERM_RE.lastIndex=0;
  const frag=document.createDocumentFragment(); let last=0, m;
  while((m=TERM_RE.exec(t))){
    const gi=m.slice(1).findIndex(x=>x!==undefined);
    frag.appendChild(document.createTextNode(t.slice(last,m.index)));
    const sp=document.createElement('span'); sp.className='piece';
    const word=TERMS[gi][2]?m[0][0].toUpperCase()+m[0].slice(1):m[0];   /* "Reservoir" is capitalised with its glyph */
    sp.innerHTML='<img src="'+gsrc(TERMS[gi][1])+'" alt="">'; sp.appendChild(document.createTextNode(word));
    frag.appendChild(sp); last=m.index+m[0].length;
  }
  frag.appendChild(document.createTextNode(t.slice(last)));
  node.parentNode.replaceChild(frag,node);
}
function glyphs(root){
  if(root.nodeType===3){
    const p=root.parentElement;
    if(p&&!p.closest('svg,script,style,.piece,title,.legend'))glyphText(root);
    return;
  }
  if(root.nodeType!==1||root.closest('svg,script,style,.piece,.legend'))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>
    n.parentElement.closest('svg,script,style,.piece,.legend')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const list=[]; while(w.nextNode())list.push(w.currentNode);
  list.forEach(glyphText);
}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(glyphs)))
  .observe(document.body,{childList:true,subtree:true});
glyphs(document.body);
loadGame(fromHash(),false);
</script>
