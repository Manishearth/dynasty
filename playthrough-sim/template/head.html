<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynasty Playthroughs</title>
<style>
:root{
  --canvas:#E4DDCB;--paper:#fff;--ink:#16150F;--soft:#5C584A;--rule:#C9C1AC;
  --verm:#C8291A;--pink:#F2416F;--cobalt:#175FB5;--walnut:#6E4A2C;
  --disp:"Helvetica Neue",Helvetica,Arial,sans-serif;--mono:"Courier New",Courier,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);
  font:16px/1.6 "Helvetica Neue",Helvetica,Arial,sans-serif}
a{color:var(--verm)}
header{background:var(--verm);color:#fff;padding:1.6rem 1.4rem 1.3rem}
header h1{font:700 1.5rem/1.1 var(--disp);letter-spacing:.16em;text-transform:uppercase;margin:0}
header p{margin:.5rem 0 0;font-family:var(--mono);font-size:.76rem;letter-spacing:.1em;
  text-transform:uppercase;opacity:.92}
.tabs{display:flex;gap:2px;overflow-x:auto;background:#D8D1BE;padding:0 .5rem;
  position:sticky;top:0;z-index:40;border-bottom:2px solid var(--ink)}
.tabs button{flex:none;border:0;background:transparent;padding:.7rem .85rem;cursor:pointer;
  font:700 .78rem/1 var(--mono);letter-spacing:.08em;color:var(--soft);border-bottom:3px solid transparent}
.tabs button.on{color:var(--verm);border-bottom-color:var(--verm);background:var(--paper)}
.tabs button:focus-visible{outline:2px solid var(--cobalt);outline-offset:-2px}
.wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
.script{background:var(--paper);padding:1.5rem 1.6rem 4rem;min-height:60vh}
.side{position:sticky;top:3.1rem;padding:1.2rem 1.2rem 2rem;max-height:calc(100vh - 3.1rem);overflow:auto}
@media (max-width:900px){.side{position:static;max-height:none;order:-1;background:var(--canvas)}}
.card-title{font:700 .74rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--soft);margin:0 0 .55rem}
.yr-head{border-bottom:2px solid var(--ink);padding-bottom:.7rem;margin-bottom:1.1rem}
.yr-head h2{font:700 1.15rem/1.2 var(--disp);letter-spacing:.09em;text-transform:uppercase;margin:0}
.card-txt{background:#FFF0F4;border-left:3px solid var(--pink);padding:.7rem .9rem;margin:.7rem 0 0;
  font-size:.9rem;font-style:italic}
.card-txt b{font-style:normal;font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--pink);display:block;margin-bottom:.25rem}
.ent{position:relative;margin:0 0 .1rem}
.act{display:block;width:100%;box-sizing:border-box;text-align:left;background:transparent;border:0;border-top:1px solid var(--rule);
  padding:.75rem 2.2rem .75rem .9rem;-webkit-tap-highlight-color:transparent;cursor:pointer;font:600 1.02rem/1.45 var(--disp);color:var(--ink)}
.act:hover{background:#FBF7EC}
.act.on{background:#FFF0F4;box-shadow:inset 3px 0 0 var(--verm)}
.act:focus-visible{outline:2px solid var(--cobalt);outline-offset:-2px}
.act .arrow{position:absolute;right:.75rem;top:.85rem;font-family:var(--mono);font-size:.8rem;color:var(--verm);opacity:0}
.act:hover .arrow,.act.on .arrow{opacity:1}
.say{padding:.28rem 1rem .28rem 2.1rem;font-size:.885rem;color:#332F26;cursor:default}
.say .who{font-family:var(--mono);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--verm);margin-right:.45rem}
.say.on{background:#FFF7F9}
.big{font-size:1.08rem;background:#FDF3D9;box-shadow:inset 3px 0 0 var(--walnut)}
.lot{border-top:1px solid var(--rule)}
.lot summary{list-style:none;border-top:0;padding:0;cursor:pointer}
.lotrow{display:flex;gap:.6rem;align-items:baseline;padding:.75rem .9rem}
.lot summary::-webkit-details-marker{display:none}
.lotmark{font:700 .58rem/1.7 var(--mono);letter-spacing:.12em;color:#fff;background:var(--walnut);
  padding:0 .3rem;flex:none}
.bidcount{margin-left:auto;font:700 .62rem/1 var(--mono);letter-spacing:.08em;color:var(--soft);flex:none}
.lot[open] .bidcount b{display:inline-block;transform:rotate(180deg)}
.lot[open] .bidcount{color:var(--verm)}
.bids{padding:.1rem 0 .6rem 2.1rem;border-left:2px solid #EDE6D5;margin-left:.9rem}
.bid{padding:.22rem 0;font-size:.86rem;color:#332F26}
.bid .who{font-family:var(--mono);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--walnut);margin-right:.5rem;display:inline-block;min-width:3.6rem}
.bid.pass{color:var(--soft);font-style:italic}
.hasnote{border-bottom:1px dotted var(--pink)}
.tip{position:fixed;z-index:99;max-width:22rem;background:var(--ink);color:#F4EFE2;
  padding:.7rem .85rem;font-size:.83rem;line-height:1.5;border-left:3px solid var(--pink);
  display:none;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.tip.on{display:block}
.tip.pinned{left:0!important;right:0;bottom:0;top:auto!important;max-width:none;
  border-left:0;border-top:3px solid var(--pink);padding:1rem 1.1rem 1.1rem;font-size:.9rem;
  box-shadow:0 -8px 26px rgba(0,0,0,.32)}
.tipx{display:block;margin-top:.7rem;background:transparent;border:1px solid #6a6455;color:#F4EFE2;
  font:700 .7rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:.5rem .9rem;cursor:pointer}
body.touch .hasnote::after{content:" \2299";color:var(--pink);font-size:.85em}
body.touch .say{padding-top:.5rem;padding-bottom:.5rem}
body.touch .bid{padding:.45rem 0}
body.touch .lotrow{padding:.9rem}
@media (max-width:900px){
  .side{padding:1rem .9rem 1.4rem}
  .script{padding:1.2rem 1rem 5rem}
  .tabs button{padding:.8rem .8rem}
  .act{font-size:1rem;padding:.8rem 1.9rem .8rem .8rem}
  .bids{padding-left:1.2rem;margin-left:.5rem}
  .bid .who{min-width:3.2rem}
  .obj .on{min-width:3.6rem}
  .pips i{width:1.45rem}
}
.tip .th{margin:0 0 .55rem;padding-left:.1rem}
.tip .th:last-of-type{margin-bottom:0}
.tip .th b{display:block;font:700 .64rem/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#F2A0B8}
.tip i{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--pink);font-style:normal;margin-bottom:.3rem}
/* ---- what changed (the Δ on each step) ---- */
.dbtn{position:absolute;width:1.35rem;height:1.35rem;padding:0;border:1px solid var(--rule);border-radius:50%;
  background:var(--paper);color:var(--soft);font:700 .86rem/1 var(--disp);cursor:help}
.dbtn:hover,.dbtn:focus-visible{border-color:var(--verm);color:var(--verm);outline:none}
.dbtn.d-act{right:2rem;top:.78rem}.dbtn.d-lot{right:.55rem;top:.68rem}.dbtn.d-say{right:.55rem;top:.25rem}
.ent.hasd .act{padding-right:3.9rem}.ent.hasd .lotrow{padding-right:2.4rem}.ent.hasd .say{padding-right:2.4rem}
.tip .drow{display:flex;gap:.7rem;align-items:baseline;margin:.2rem 0}
.tip .drow b{flex:none;min-width:5.6rem;font:700 .64rem/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#F2A0B8}
.tip .dp{display:inline-block;white-space:nowrap;margin-right:.6rem;font:700 .8rem/1.4 var(--mono)}
.tip .dp.up{color:#A8E3B8}.tip .dp.dn{color:#FFB8AB}
.tip .dg{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.17em}
.tip img.dg{filter:brightness(0) invert(1)}
.tip .dland{background:#4F8FD8;border:1px solid #A9CBF2;width:.85em;height:.85em;vertical-align:-.08em}
.tip .dsol{border-radius:50%;background:#F4EFE2;width:.8em;height:.8em;vertical-align:-.05em}.tip .dsol.b{background:#5B9BE6}
/* ---- map ---- */
.map{background:#EFE4CB;border:2px solid var(--ink);margin-bottom:1rem;line-height:0}
#map svg{width:100%;height:auto;display:block}
.cell{background:#F6F2E6;padding:.42rem .45rem;min-height:4.9rem;position:relative}
.wall{min-height:0;padding:.3rem;text-align:center;background:#EFEADC;
  font:700 .62rem/1 var(--mono);letter-spacing:.1em;color:var(--soft)}
.sea{background:#E3EEF9;display:flex;align-items:center;justify-content:center}
.sea span{writing-mode:vertical-rl;font:700 .64rem/1 var(--mono);letter-spacing:.2em;color:var(--cobalt)}
.und{background:#EAE4D2}

.cell.hl{background:#FFE9EF;box-shadow:inset 0 0 0 2px var(--pink)}
.pn{font:700 .62rem/1 var(--mono);letter-spacing:.08em;color:var(--soft)}
.pname{font:700 .82rem/1.15 var(--disp);margin:.15rem 0 .1rem}
.pg{font-family:var(--mono);font-size:.72rem}
.pg.neg{color:var(--verm);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:2px;margin-top:.22rem}
.chip{font:700 .56rem/1 var(--mono);padding:.14rem .22rem;background:var(--walnut);color:#fff;border-radius:2px}
.chip.r{background:var(--pink)}
.chip.s{background:var(--ink)}
.chip.w{background:var(--cobalt)}
table.res{width:100%;border-collapse:collapse;font-size:.75rem;background:var(--paper)}
table.res th,table.res td{padding:.32rem .35rem;border-bottom:1px solid var(--rule);text-align:left}
table.res th{font:700 .64rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
table.res td.n{text-align:right;font-family:var(--mono)}
table.res tr.moved td{background:#FDF3D9}
.neg{color:var(--verm);font-weight:700}
.works{font-size:.76rem;font-family:var(--mono);line-height:1.7;background:var(--paper);padding:.6rem .7rem}
.bar{height:7px;background:#E2DBC8;margin:.2rem 0 .45rem;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--verm)}
.obj{display:flex;align-items:center;gap:.5rem;padding:.22rem .1rem;font-size:.75rem}
.obj .on{font:700 .72rem/1 var(--mono);letter-spacing:.05em;min-width:4.1rem;color:var(--ink)}
.pips{display:flex;gap:2px}
.pips i{font:700 .56rem/1.5 var(--mono);font-style:normal;width:1.55rem;text-align:center;
  border:1px solid var(--rule);color:#B7AE97;background:#fff}
.pips i.f{background:var(--walnut);border-color:var(--walnut);color:#fff}
.pips i.r{background:var(--pink);border-color:var(--pink)}
.objn{margin-left:auto;font:700 .68rem/1 var(--mono);color:var(--soft)}
.objn.done{color:#1B7A3F}
.objnote{font:italic .68rem/1 var(--disp);color:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:.15rem .8rem;align-items:center;
  font-family:var(--mono);font-size:.62rem;letter-spacing:.03em;color:var(--soft);margin:-.6rem 0 1rem}
.piece{white-space:nowrap}
.piece img{width:1.05em;height:1.05em;margin-right:.18em;vertical-align:-.17em}
.legend .piece img{width:.85rem;height:.85rem;margin-right:.25rem;vertical-align:-2px}
.legend .sw img{display:block;width:100%;height:100%;filter:brightness(0) invert(1)}
.pips i img{width:.8rem;height:.8rem;vertical-align:-2px}
.pips i.f img{filter:brightness(0) invert(1)}
header .piece img{filter:brightness(0) invert(1)}
.legend .sw{display:inline-block;width:.7rem;height:.7rem;margin-right:.25rem;vertical-align:-1px}
.legend .raid{background:#F2416F}.legend .imp{background:var(--verm);width:.85rem;height:.85rem}
.legend .sol{background:#16150F;border-radius:50%}.legend .osol{background:#175FB5;border-radius:50%}
.nav{display:flex;gap:.4rem;margin:1.2rem 0 0}
.nav button{flex:1;padding:.55rem;border:1.5px solid var(--ink);background:var(--paper);cursor:pointer;
  font:700 .72rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.nav button:hover{background:var(--ink);color:#fff}
.final{background:var(--paper);padding:1.4rem 1.6rem 2rem}
.final h2{font:700 1.1rem/1.2 var(--disp);letter-spacing:.1em;text-transform:uppercase;margin:0 0 .8rem}
.final table{width:100%;border-collapse:collapse;font-size:.87rem}
.final th,.final td{padding:.42rem .5rem;border-bottom:1px solid var(--rule);text-align:left}
.final th{font:700 .66rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.v-won{color:#1B7A3F;font-weight:700}.v-lost{color:var(--verm);font-weight:700}.v-held{color:var(--soft)}
.hint{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--soft);margin:.6rem 0 0}

.games{display:flex;gap:.5rem;margin:1rem 0 0;overflow-x:auto;padding-bottom:.15rem}
.game{flex:none;text-align:left;border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;
  padding:.55rem .8rem;cursor:pointer;font-family:var(--disp);min-width:11rem}
.game b{display:block;font-size:.88rem;letter-spacing:.04em}
.game span{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;opacity:.85;margin-top:.15rem}
.game:hover{border-color:#fff}
.game.on{background:#fff;color:var(--verm);border-color:#fff}
.game:focus-visible{outline:2px solid #fff;outline-offset:2px}
header .blurb{font-family:var(--disp);font-size:.88rem;letter-spacing:0;text-transform:none;opacity:.95;
  margin:.75rem 0 0;max-width:46rem;line-height:1.45}
.worktot{font-family:var(--mono);font-size:.68rem;color:var(--soft);margin-top:.3rem}
table.res tr.pile td{color:var(--soft);font-style:italic;border-bottom:0}
.legend .wat{background:var(--cobalt);width:.85rem;height:.85rem}
.legend .can{background:#2E5E4E;height:.3rem;border-top:1px solid #9CCFC0}
.legend .wal{background:#C9A877;height:.3rem;border:1px solid #6B4B2E}
.legend .riv{background:#8CC3DD;height:.25rem;border:1px solid #2F6C92;border-radius:2px}
.legend .land{background:#4F8FD8;opacity:.75;border:1px solid #175FB5}
.legend .empty{background:repeating-linear-gradient(45deg,#E6DFCB 0 2px,#D3CAB2 2px 4px)}
.game .brief{display:none}
@media (max-width:640px){
  header{padding:1.2rem 1rem 1rem}
  .games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.35rem;overflow:visible}
  .game{min-width:0;padding:.45rem .5rem}
  .game b{font-size:.78rem;letter-spacing:.02em}
  .game .long{display:none}.game .brief{display:block;font-size:.6rem;letter-spacing:.02em}
}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:640px){.final{padding:1.1rem 1rem 1.6rem}.final table{font-size:.78rem}.final th,.final td{padding:.38rem .35rem}}
</style>
</head>
<body>
<header>
  <h1>Dynasty — Playthroughs</h1>
  <div class="games" id="games" role="group" aria-label="Choose a playthrough"></div>
  <p class="blurb" id="blurb"></p>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="wrap">
  <main class="script" id="script"></main>
  <aside class="side">
    <p class="card-title">The board</p>
    <div class="map" id="map"></div>
    <div id="legend" class="legend"></div>
    <p class="card-title" id="objtitle">Objectives</p>
    <div id="obj" style="background:var(--paper);padding:.5rem .6rem;margin-bottom:1rem"></div>
    <p class="card-title">Public works</p>
    <div class="works" id="works"></div>
    <p class="card-title" style="margin-top:1rem">Players</p>
    <table class="res" id="res"></table>
    <div class="nav">
      <button id="prev">‹ Step back</button>
      <button id="next">Step forward ›</button>
    </div>
    <p class="hint">Click any action to scrub the board. Hover an underlined line for the player's own reasoning, and a Δ for what changed hands. Arrow keys work too.</p>
  </aside>
</div>
<div class="tip" id="tip"></div>
<script id="data" type="application/json">
